<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>翻牌配对</title>
<style>
  :root { --gap: 10px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: transparent; color: var(--foreground); }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; touch-action: manipulation; }
  .app { max-width: 520px; margin: 0 auto; padding: 14px; }

  h1 { font-size: 22px; margin: 0 0 2px; }
  .sub { color: var(--muted-foreground); font-size: 13px; margin-bottom: 12px; }

  .hud { display: flex; gap: 8px; margin-bottom: 12px; }
  .hud .box { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px 0; text-align: center; }
  .hud .label { font-size: 11px; color: var(--muted-foreground); }
  .hud .value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .levels { display: flex; gap: 8px; margin-bottom: 12px; }
  .levels button { flex: 1; padding: 8px 0; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--foreground); font-size: 14px; cursor: pointer; }
  .levels button.active { background: var(--accent); color: var(--card); border-color: var(--accent); font-weight: 700; }

  #board { display: grid; gap: var(--gap); width: 100%; }
  .card { position: relative; aspect-ratio: 1/1; perspective: 600px; cursor: pointer; }
  .card .inner { position: absolute; inset: 0; transition: transform .35s; transform-style: preserve-3d; }
  .card.open .inner, .card.done .inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
  .face.back { background: var(--card); font-size: 26px; }
  .face.front { background: var(--accent); transform: rotateY(180deg); font-size: 34px; color: var(--card); }
  .card.done .face.front { opacity: .55; animation: pop .3s; }
  .card.shake .inner { animation: shake .3s; }
  @keyframes pop { 50% { transform: rotateY(180deg) scale(1.15); } }
  @keyframes shake { 25% { transform: rotateY(180deg) translateX(-4px); } 75% { transform: rotateY(180deg) translateX(4px); } }

  .bar { display: flex; gap: 8px; margin-top: 12px; }
  .bar button { flex: 1; padding: 12px 0; border-radius: 12px; border: none; background: var(--accent); color: var(--card); font-size: 15px; font-weight: 700; cursor: pointer; }

  #win { display: none; position: fixed; inset: 0; background: color-mix(in srgb, var(--foreground) 35%, transparent); align-items: center; justify-content: center; }
  #win .panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px 30px; text-align: center; }
  #win .title { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
  #win .stats { color: var(--muted-foreground); font-size: 14px; margin-bottom: 16px; line-height: 1.7; }
  #win .best { color: var(--accent); font-weight: 700; }
  #win button { padding: 10px 28px; border-radius: 10px; border: none; background: var(--accent); color: var(--card); font-size: 15px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <h1>🃏 翻牌配对</h1>
  <div class="sub">翻开两张一样的牌就算配对成功，全部配对即通关～</div>
  <div class="hud">
    <div class="box"><div class="label">步数</div><div class="value" id="moves">0</div></div>
    <div class="box"><div class="label">时间</div><div class="value" id="time">0:00</div></div>
    <div class="box"><div class="label">剩余</div><div class="value" id="left">-</div></div>
    <div class="box"><div class="label">最佳</div><div class="value" id="best">-</div></div>
  </div>
  <div class="levels">
    <button data-cols="4" data-pairs="6" class="active">简单 12张</button>
    <button data-cols="4" data-pairs="8">普通 16张</button>
    <button data-cols="6" data-pairs="12">困难 24张</button>
  </div>
  <div id="board"></div>
  <div class="bar"><button id="restart">🔄 重新开始</button></div>
</div>

<div id="win">
  <div class="panel">
    <div class="title">🎉 全部配对成功！</div>
    <div class="stats" id="winStats"></div>
    <button id="again">再来一局</button>
  </div>
</div>

<script>
// ===== 想换成她的照片？把下面数组里的 emoji 换成 "photo1.jpg" 这样的文件名，
// 和本文件放同一个文件夹即可（最多用 12 张）。
const FACES = ['🍓','🐱','🐼','🍰','🌸','⭐','🐙','🌻','🍀','🎀','🦊','🍑'];

const board = document.getElementById('board');
const elMoves = document.getElementById('moves'), elTime = document.getElementById('time'),
      elLeft = document.getElementById('left'), elBest = document.getElementById('best');
const winPanel = document.getElementById('win'), winStats = document.getElementById('winStats');

let cols = 4, pairs = 6, first = null, lock = false, moves = 0, matched = 0, startT = 0, timerId = null;

function fmt(s) { return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

function tick() { elTime.textContent = fmt(Math.floor((Date.now() - startT)/1000)); }

function bestKey() { return 'memory-best-' + pairs; }

function start() {
  clearInterval(timerId);
  first = null; lock = false; moves = 0; matched = 0;
  elMoves.textContent = '0'; elTime.textContent = '0:00'; winPanel.style.display = 'none';
  const chosen = FACES.slice();
  // shuffle faces then take pairs
  for (let i = chosen.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [chosen[i],chosen[j]]=[chosen[j],chosen[i]]; }
  const deck = chosen.slice(0, pairs);
  const cards = deck.concat(deck);
  for (let i = cards.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [cards[i],cards[j]]=[cards[j],cards[i]]; }

  board.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
  board.innerHTML = '';
  cards.forEach(face => {
    const c = document.createElement('div');
    c.className = 'card';
    const isPhoto = !/^[\u{1F000}-\u{1FAFF}\u2600-\u27BF\u2B00-\u2BFF]/u.test(face);
    c.innerHTML = '<div class="inner"><div class="face back">❓</div>' +
      '<div class="face front">' + (isPhoto ? '<img src="'+face+'" style="width:100%;height:100%;object-fit:cover;border-radius:12px">' : face) + '</div></div>';
    c.addEventListener('click', () => flip(c, face));
    board.appendChild(c);
  });
  elLeft.textContent = pairs;
  const b = localStorage.getItem(bestKey());
  elBest.textContent = b ? fmt(+b) : '-';
  startT = Date.now();
  timerId = setInterval(tick, 500);
}

function flip(c, face) {
  if (lock || c.classList.contains('open') || c.classList.contains('done')) return;
  c.classList.add('open');
  if (!first) { first = [c, face]; return; }
  moves++; elMoves.textContent = moves;
  const [c1, f1] = first; first = null;
  if (f1 === face) {
    c1.classList.add('done'); c.classList.add('done');
    matched++; elLeft.textContent = pairs - matched;
    if (matched === pairs) finish();
  } else {
    lock = true;
    c1.classList.add('shake'); c.classList.add('shake');
    setTimeout(() => {
      [c1, c].forEach(x => { x.classList.remove('open','shake'); });
      lock = false;
    }, 750);
  }
}

function finish() {
  clearInterval(timerId);
  const secs = Math.floor((Date.now() - startT)/1000);
  const key = bestKey();
  const prev = localStorage.getItem(key);
  let bestMsg = '';
  if (!prev || secs < +prev) { localStorage.setItem(key, secs); bestMsg = '<span class="best">🏆 新纪录！</span>'; }
  else { bestMsg = '最佳纪录 ' + fmt(+prev); elBest.textContent = fmt(+prev); }
  winStats.innerHTML = '用时 ' + fmt(secs) + ' · 步数 ' + moves + '<br>' + bestMsg;
  setTimeout(() => { winPanel.style.display = 'flex'; }, 400);
}

document.querySelectorAll('.levels button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.levels button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  cols = +b.dataset.cols; pairs = +b.dataset.pairs;
  document.documentElement.style.setProperty('--gap', cols > 4 ? '6px' : '10px');
  start();
}));
document.getElementById('restart').addEventListener('click', start);
document.getElementById('again').addEventListener('click', start);
start();
</script>
</body>
</html>
